<!doctype html>
<!--
  The source product is Hebrew-only, RTL-only — see known-gaps.md G14 ("the
  platform is a Hebrew-only private business app, not a SaaS. There is no
  localization or translation rigor target"). RTL is therefore a
  document-level, first-class setting here, not a per-component patch
  applied after the fact.

  This file replaces the old app/layout.tsx: in a SPA the <html> shell is
  static, so lang/dir/title are plain markup rather than something React
  renders on every request.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The source titles its pages "אורי והבננות" — the product's real name. -->
    <title>אורי והבננות</title>
    <meta name="description" content="ניהול הזמנות ומלאי לשיווק תוצרת חקלאית" />
    <!--
      Applies the saved colour theme before the first paint. It has to be a
      small inline script here in <head>: the React bundle only runs after the
      page has been drawn once, so leaving this to React would flash the light
      theme at every dark-mode user on every load.

      Mirrors parseThemePreference + resolveTheme in src/lib/theme.ts (same
      storage key, same fallback to "system") — change one, change the other.

      If a Content-Security-Policy is ever added, it has to allow this block
      by its sha256 hash (not with 'unsafe-inline', which would also allow any
      injected script to run) — otherwise the browser blocks it and the flash
      comes back.
    -->
    <script>
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem("ori-theme");
        } catch (error) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
